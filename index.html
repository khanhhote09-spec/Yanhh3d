<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YanHH3D</title>
    <!-- DNS 1.1.1.1 (Cloudflare) prefetch & preconnect -->
    <link rel="dns-prefetch" href="https://one.one.one.one">
    <link rel="dns-prefetch" href="https://cloudflare-dns.com">
    <link rel="preconnect" href="https://one.one.one.one" crossorigin>
    <link rel="preconnect" href="https://cloudflare-dns.com" crossorigin>
    <link rel="preconnect" href="https://yanhh3d.baby">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body, .iframe-container, iframe { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        html::-webkit-scrollbar, body::-webkit-scrollbar, .iframe-container::-webkit-scrollbar, iframe::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        html, body {
            width: 100%; max-width: 100vw; height: 100vh; height: 100dvh; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
            overscroll-behavior-y: none; touch-action: pan-x pan-y;
        }
        :fullscreen .url-bar, :-webkit-full-screen .url-bar { display: none !important; }
        .backdrop { position: fixed; inset: 0; z-index: 999998; display: none; }
        .backdrop.active { display: block; }

        .url-bar {
            width: 52px; height: 52px; background: transparent; display: flex; align-items: center; justify-content: center;
            gap: 8px; z-index: 999999; position: absolute; top: 0; right: 0; cursor: pointer;
            transition: width 0.15s cubic-bezier(0, 0, 0.2, 1), height 0.15s cubic-bezier(0, 0, 0.2, 1), background 0.15s ease;
            will-change: width, height;
        }
        .url-bar.active-mode { width: 100%; height: 48px; background: #121212; border-bottom: 1px solid rgba(255,255,255,0.12); padding: 0 10px; cursor: default; }

        .brand-logo {
            display: none; opacity: 0; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
            border: 1.5px solid rgba(255,255,255,0.25); background: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .url-bar.active-mode .brand-logo { display: block; opacity: 1; border-color: #ff9500; cursor: pointer; }
        .url-bar.active-mode .brand-logo:active { transform: scale(0.92); }

        .url-bar input {
            width: 0; opacity: 0; pointer-events: none; height: 34px; border-radius: 17px; border: none;
            background: #1e1e1e; color: #fff !important; font-size: 13px; outline: none;
            -webkit-user-select: text; user-select: text; transition: opacity 0.15s ease;
        }
        .url-bar.active-mode input { flex: 1; width: auto; opacity: 1; pointer-events: auto; padding: 0 12px; border: 1px solid #2a2a2a; }
        .url-bar input:focus { border-color: #007aff; background: #181818; }

        .btn-icon {
            display: none; opacity: 0; pointer-events: none; height: 34px; width: 34px; border-radius: 17px;
            border: none; color: #fff; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .btn-icon.set-btn { background: #34c759; }
        .url-bar.active-mode .btn-icon { display: flex; opacity: 1; pointer-events: auto; }
        .btn-icon svg { width: 16px; height: 16px; fill: currentColor; pointer-events: none; }

        .iframe-container { flex: 1; width: 100%; height: 100%; background: #000; position: relative; overflow: hidden; -webkit-overflow-scrolling: touch; z-index: 1; }
        iframe { width: calc(100% + 20px) !important; height: 100% !important; border: none; display: block; will-change: transform; transform: translate3d(0,0,0); -webkit-user-select: text !important; user-select: text !important; }
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="iframe-container" id="iframe-container">
        <iframe id="main-iframe" src="https://yanhh3d.baby/" title="Website" loading="eager" fetchpriority="high"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen webkitallowfullscreen mozallowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <div class="url-bar" id="url-bar" title="Bấm để mở thanh công cụ">
        <img src="" alt="Site Icon" class="brand-logo" id="brand-logo" title="Trang chủ đã set">
        <input type="text" id="link-input" placeholder="https://..." autocomplete="off" spellcheck="false">
        <button class="btn-icon set-btn" id="set-btn" title="Lưu làm link mặc định (Set Web)">
            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l2 2h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm-6-11h-2v3H8l4 4 4-4h-3v-3z"/></svg>
        </button>
    </div>

    <script>
        window.open = () => null;
        document.addEventListener('click', e => {
            const a = e.target.closest('a');
            if (a && ['_blank', '_top', '_parent'].includes(a.target)) a.target = '_self';
        }, true);

        document.addEventListener('keydown', e => {
            if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r')) e.preventDefault();
        });
        window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; return ''; });

        let lastTouchY = 0;
        document.addEventListener('touchstart', e => { if (e.touches.length === 1) lastTouchY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchmove', e => {
            const y = e.touches[0]?.clientY;
            if (y !== undefined && window.scrollY <= 0 && y > lastTouchY && e.cancelable) e.preventDefault();
            lastTouchY = y ?? lastTouchY;
        }, { passive: false });

        const HARDCODED_LINK = 'https://yanhh3d.baby/';
        const PREFIX = 'https://';
        const FALLBACK_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23ff9500"/><stop offset="100%" stop-color="%23ff2d55"/></linearGradient></defs><rect width="64" height="64" rx="32" fill="url(%23g)"/><text x="50%" y="54%" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="%23fff" text-anchor="middle" dominant-baseline="middle">WEB</text></svg>';
        const $ = id => document.getElementById(id);
        const input = $('link-input'), iframe = $('main-iframe'), urlBar = $('url-bar'), backdrop = $('backdrop'), brandLogo = $('brand-logo');

        const normalizeUrl = u => {
            const trimmed = (u || '').trim();
            if (!trimmed) return HARDCODED_LINK;
            const withoutScheme = trimmed.replace(/^https?:\/\//i, '');
            return withoutScheme ? PREFIX + withoutScheme : HARDCODED_LINK;
        };
        const getCustomHome = () => normalizeUrl(localStorage.getItem('custom_main_link') || HARDCODED_LINK);

        function enforceHttpsPrefix() {
            let val = input.value;
            if (!val.startsWith(PREFIX)) {
                const stripped = val.replace(/^https?:\/\//i, '');
                input.value = PREFIX + stripped;
            }
            if (input.selectionStart < PREFIX.length) {
                const pos = Math.max(PREFIX.length, input.selectionEnd);
                input.setSelectionRange(PREFIX.length, pos);
            }
        }

        input.addEventListener('keydown', e => {
            const start = input.selectionStart ?? 0;
            const end = input.selectionEnd ?? 0;
            if (e.key === 'Backspace' && start <= PREFIX.length && end <= PREFIX.length) {
                e.preventDefault();
                input.setSelectionRange(PREFIX.length, PREFIX.length);
            } else if (e.key === 'Delete' && start < PREFIX.length) {
                e.preventDefault();
                input.setSelectionRange(PREFIX.length, Math.max(PREFIX.length, end));
            }
        });
        input.addEventListener('input', enforceHttpsPrefix);
        input.addEventListener('click', enforceHttpsPrefix);
        input.addEventListener('focus', () => requestAnimationFrame(enforceHttpsPrefix));

        brandLogo.src = FALLBACK_LOGO;
        brandLogo.addEventListener('error', () => { if (brandLogo.src !== FALLBACK_LOGO) brandLogo.src = FALLBACK_LOGO; });

        function updateBrandLogo(url) {
            try {
                const parsed = new URL(normalizeUrl(url));
                brandLogo.title = `Trang chủ: ${parsed.hostname}`;
                brandLogo.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(parsed.hostname)}&sz=64`;
            } catch {
                brandLogo.src = FALLBACK_LOGO;
            }
        }

        function closeUrlBar() {
            urlBar.classList.remove('active-mode');
            backdrop.classList.remove('active');
            input.blur();
        }

        function openUrlBar(e) {
            e?.preventDefault(); e?.stopPropagation();
            const homeUrl = getCustomHome();
            input.value = homeUrl;
            updateBrandLogo(homeUrl);
            urlBar.classList.add('active-mode');
            backdrop.classList.add('active');
            requestAnimationFrame(() => setTimeout(() => { input.focus(); enforceHttpsPrefix(); }, 50));
        }

        function setIframeSrc(url) {
            closeUrlBar();
            requestAnimationFrame(() => { if (iframe.src !== url) iframe.src = url; });
        }

        function loadHome() {
            const homeUrl = getCustomHome();
            input.value = homeUrl;
            updateBrandLogo(homeUrl);
            setIframeSrc(homeUrl);
        }

        function navigate() {
            const raw = input.value.trim();
            const body = raw.replace(/^https?:\/\//i, '').trim();
            if (!body) return loadHome();
            const isUrl = body.includes('.') && !body.includes(' ');
            const targetUrl = isUrl ? PREFIX + body : `https://www.google.com/search?q=${encodeURIComponent(body)}&igu=1`;
            input.value = targetUrl;
            setIframeSrc(targetUrl);
        }

        let touchStarted = false;
        urlBar.addEventListener('touchstart', e => { touchStarted = true; if (!urlBar.classList.contains('active-mode')) openUrlBar(e); }, { passive: false });
        urlBar.addEventListener('click', e => {
            if (touchStarted) { touchStarted = false; return; }
            if (!urlBar.classList.contains('active-mode')) openUrlBar(e);
        });

        brandLogo.addEventListener('click', e => { if (urlBar.classList.contains('active-mode')) { e.stopPropagation(); loadHome(); } });
        backdrop.addEventListener('touchstart', closeUrlBar, { passive: true });
        backdrop.addEventListener('click', closeUrlBar);

        $('set-btn').onclick = e => {
            e.stopPropagation();
            const fullUrl = normalizeUrl(input.value);
            localStorage.setItem('custom_main_link', fullUrl);
            input.value = fullUrl;
            updateBrandLogo(fullUrl);
            loadHome();
        };
        input.onkeypress = e => { if (e.key === 'Enter') navigate(); };

        const handleFullscreenOrientation = () => {
            const fs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
            if (fs && screen.orientation?.lock) screen.orientation.lock('landscape').catch(() => {});
            else if (!fs && screen.orientation?.unlock) screen.orientation.unlock();
        };
        document.addEventListener('fullscreenchange', handleFullscreenOrientation);
        document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);

        let wakeLock = null;
        const requestWakeLock = async () => {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch {}
        };
        document.addEventListener('DOMContentLoaded', () => { loadHome(); requestWakeLock(); });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });
        ['click', 'touchstart', 'mousemove'].forEach(evt => document.addEventListener(evt, () => { if (!wakeLock) requestWakeLock(); }, { passive: true }));
    </script>
</body>
</html>
