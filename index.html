<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YanHH3D</title>
    <link rel="preconnect" href="https://yanhh3d.chat" crossorigin>
    <link rel="dns-prefetch" href="https://yanhh3d.chat">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, .iframe-container, iframe {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        
        html::-webkit-scrollbar, 
        body::-webkit-scrollbar, 
        .iframe-container::-webkit-scrollbar, 
        iframe::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        :fullscreen .url-bar, :-webkit-full-screen .url-bar {
            display: none !important;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999998;
            display: none;
            background: transparent;
        }

        .backdrop.active {
            display: block;
        }

        .url-bar {
            width: 60px;
            height: 60px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            gap: 6px;
            z-index: 999999;
            position: absolute;
            top: 0;
            right: 0;
            cursor: pointer;
            pointer-events: auto;
            transition: width 0.15s cubic-bezier(0, 0, 0.2, 1), height 0.15s cubic-bezier(0, 0, 0.2, 1);
            will-change: width, height;
        }

        .url-bar.active-mode {
            width: 100%;
            height: 48px;
            background: #121212;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0 8px;
            cursor: default;
        }

        .url-bar input {
            width: 0;
            opacity: 0;
            pointer-events: none;
            height: 34px;
            padding: 0;
            border-radius: 17px;
            border: none;
            background: #1e1e1e;
            color: #fff !important;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: opacity 0.15s ease;
        }

        .url-bar.active-mode input {
            flex: 1;
            width: auto;
            opacity: 1;
            pointer-events: auto;
            padding: 0 12px;
            border: 1px solid #2a2a2a;
        }

        .url-bar input:focus {
            border-color: #007aff;
            background: #181818;
        }

        .btn-icon {
            height: 34px;
            width: 34px;
            border-radius: 17px;
            border: none;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-text.set-btn, .btn-icon.send-btn {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .btn-text.set-btn {
            height: 34px;
            padding: 0 10px;
            border-radius: 17px;
            border: none;
            background: #34c759;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .btn-icon.send-btn {
            background: #ff9500;
        }

        .url-bar.active-mode .btn-text.set-btn,
        .url-bar.active-mode .btn-icon.send-btn {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
        }

        iframe {
            width: calc(100% + 20px) !important;
            height: 100% !important;
            border: none;
            display: block;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>

    <div class="iframe-container" id="iframe-container">
        <iframe id="main-iframe" src="https://yanhh3d.chat/" title="Website" loading="eager" 
            allowfullscreen 
            webkitallowfullscreen 
            mozallowfullscreen
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; web-share; screen-wake-lock; orientation" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-orientation-lock allow-downloads allow-modals">
        </iframe>
    </div>

    <div class="url-bar" id="url-bar" title="Bấm góc trên bên phải để nhập link">
        <input type="text" id="link-input" value="" placeholder="Nhập link hoặc từ khóa..." autocomplete="off" spellcheck="false">
        <button class="btn-text set-btn" id="set-btn" title="Lưu làm link mặc định (Set Web)">Set Web</button>
        <button class="btn-icon send-btn" id="send-btn" title="Gửi nội dung">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        window.open = function() { return null; };
        document.addEventListener('click', function(e) {
            let target = e.target.closest('a');
            if (target && (target.target === '_blank' || target.target === '_top' || target.target === '_parent')) {
                target.target = '_self';
            }
        }, true);

        const HARDCODED_LINK = 'https://yanhh3d.chat/';
        const $ = id => document.getElementById(id);
        const input = $('link-input'), iframe =$('main-iframe'), urlBar = $('url-bar'), backdrop =$('backdrop');

        function stripProtocol(url) {
            return url.replace(/^https?:\/\//i, '');
        }

        function getCustomHome() {
            return localStorage.getItem('custom_main_link') || HARDCODED_LINK;
        }

        function closeUrlBar() {
            urlBar.classList.remove('active-mode');
            backdrop.classList.remove('active');
            input.blur();
        }

        function openUrlBar(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            urlBar.classList.add('active-mode');
            backdrop.classList.add('active');
            requestAnimationFrame(() => {
                setTimeout(() => input.focus(), 50);
            });
        }

        function setIframeSrc(url) {
            closeUrlBar();
            requestAnimationFrame(() => {
                if (iframe.src !== url) {
                    iframe.src = url;
                }
            });
        }

        function loadHome() {
            const homeUrl = getCustomHome();
            input.value = stripProtocol(homeUrl);
            setIframeSrc(homeUrl);
        }

        document.addEventListener('DOMContentLoaded', loadHome);

        function navigate() {
            let val = input.value.trim();
            if (!val) {
                loadHome();
                return;
            }
            
            let targetUrl = val;
            if (/^https?:\/\//i.test(val) || (val.includes('.') && !val.includes(' '))) {
                if (!/^https?:\/\//i.test(val)) targetUrl = 'https://' + val;
                input.value = stripProtocol(targetUrl);
                setIframeSrc(targetUrl);
            } else {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
                input.value = val;
                setIframeSrc(targetUrl);
            }
        }

        // Khắc phục triệt để sự kiện click/touch trên mobile cho thanh URL
        urlBar.addEventListener('click', function(e) {
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        });
        
        urlBar.addEventListener('touchend', function(e) {
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        }, {passive: false});

        backdrop.addEventListener('touchstart', closeUrlBar, {passive: true});
        backdrop.addEventListener('click', closeUrlBar);

        $('set-btn').onclick = (e) => {
            e.stopPropagation();
            let val = input.value.trim();
            let fullUrl = val || stripProtocol(getCustomHome());

            if (val && !/^https?:\/\//i.test(val) && val.includes('.')) {
                fullUrl = 'https://' + val;
            } else if (!/^https?:\/\//i.test(fullUrl)) {
                fullUrl = 'https://' + fullUrl;
            }

            localStorage.setItem('custom_main_link', fullUrl);
            alert('Đã thiết lập link mặc định mới:\n' + fullUrl);
            loadHome();
        };

        $('send-btn').onclick = (e) => {
            e.stopPropagation();
            navigate();
        };

        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                navigate();
            }
        };

        const handleFullscreenOrientation = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
            if (isFullscreen && screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            } else if (!isFullscreen && screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenOrientation);
        document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);

        let wakeLock = null;
        const reqWake = async () => { if ('wakeLock' in navigator) try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} };
        document.addEventListener('DOMContentLoaded', reqWake);
        document.onclick = () => { if (!wakeLock) reqWake(); };
    </script>
</body>
</html>
