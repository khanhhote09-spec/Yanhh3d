<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YanHH3D</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, .iframe-container, iframe {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        
        html::-webkit-scrollbar, 
        body::-webkit-scrollbar, 
        .iframe-container::-webkit-scrollbar, 
        iframe::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            /* Chặn hiệu ứng kéo nảy (bounce) và kéo xuống reload trên mobile */
            overscroll-behavior-y: none;
            touch-action: pan-x pan-y;
        }

        :fullscreen .url-bar, :-webkit-full-screen .url-bar {
            display: none !important;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999998;
            display: none;
            background: transparent;
        }

        .backdrop.active {
            display: block;
        }

        .url-bar {
            width: 60px;
            height: 60px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            gap: 6px;
            z-index: 999999;
            position: absolute;
            top: 0;
            right: 0;
            cursor: pointer;
            pointer-events: auto;
            transition: width 0.15s cubic-bezier(0, 0, 0.2, 1), height 0.15s cubic-bezier(0, 0, 0.2, 1);
            will-change: width, height;
        }

        .url-bar.active-mode {
            width: 100%;
            height: 48px;
            background: #121212;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0 8px;
            cursor: default;
        }

        .url-bar input {
            width: 0;
            opacity: 0;
            pointer-events: none;
            height: 34px;
            padding: 0;
            border-radius: 17px;
            border: none;
            background: #1e1e1e;
            color: #fff !important;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: opacity 0.15s ease;
        }

        .url-bar.active-mode input {
            flex: 1;
            width: auto;
            opacity: 1;
            pointer-events: auto;
            padding: 0 12px;
            border: 1px solid #2a2a2a;
        }

        .url-bar input:focus {
            border-color: #007aff;
            background: #181818;
        }

        .btn-icon {
            height: 34px;
            width: 34px;
            border-radius: 17px;
            border: none;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .btn-icon.set-btn {
            background: #34c759;
        }

        .btn-icon.reload-btn {
            background: #007aff;
        }

        .url-bar.active-mode .btn-icon.set-btn,
        .url-bar.active-mode .btn-icon.reload-btn {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
        }

        iframe {
            width: calc(100% + 20px) !important;
            height: 100% !important;
            border: none;
            display: block;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>

    <div class="iframe-container" id="iframe-container">
        <!-- Sandbox chặn popup, nhảy tab và quảng cáo độc hại -->
        <iframe id="main-iframe" src="https://yanhh3d.de/" title="Website" loading="eager" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen 
            webkitallowfullscreen 
            mozallowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms">
        </iframe>
    </div>

    <div class="url-bar" id="url-bar" title="Bấm góc trên bên phải để nhập link">
        <input type="text" id="link-input" value="" placeholder="Nhập link..." autocomplete="off" spellcheck="false">
        <button class="btn-icon reload-btn" id="reload-btn" title="Tải lại trang">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="btn-icon set-btn" id="set-btn" title="Lưu làm link mặc định (Set Web)">
            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l2 2h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm-6-11h-2v3H8l4 4 4-4h-3v-3z"/></svg>
        </button>
    </div>

    <script>
        // Chặn hoàn toàn lệnh mở cửa sổ mới từ Javascript của trang web bên trong
        window.open = function() { return null; };
        
        // Tự động ép tất cả các thẻ a có target=_blank chuyển về mở ngay tại khung hiện tại (_self)
        document.addEventListener('click', function(e) {
            let target = e.target.closest('a');
            if (target && (target.target === '_blank' || target.target === '_top' || target.target === '_parent')) {
                target.target = '_self';
            }
        }, true);

        // --- CHẶN TẢI LẠI (RELOAD) & PHÍM TẮT ---

        // 1. Chặn các phím tắt tải lại trang (F5, Ctrl+R, Cmd+R, và cả Ctrl+F5)
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F5' || 
                (e.ctrlKey && e.key.toLowerCase() === 'r') || 
                (e.metaKey && e.key.toLowerCase() === 'r')
            ) {
                e.preventDefault();
                console.log("Đã chặn hành vi tải lại trang bằng phím tắt.");
            }
        });

        // 2. Hiển thị hộp thoại cảnh báo khi người dùng bấm nút Reload trên trình duyệt hoặc đóng tab
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = ''; // Bắt buộc đối với các trình duyệt hiện đại
            return '';
        });

        // 3. Chặn hành vi kéo vuốt xuống (Pull-to-refresh) trên thiết bị di động
        let lastTouchY = 0;
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                lastTouchY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            let touchY = e.touches[0].clientY;
            // Nếu người dùng đang ở đầu trang và cố gắng kéo xuống tiếp thì chặn lại
            if (window.scrollY <= 0 && touchY > lastTouchY && e.cancelable) {
                e.preventDefault();
            }
            lastTouchY = touchY;
        }, { passive: false });

        // ----------------------------------------

        const HARDCODED_LINK = 'https://yanhh3d.de/';
        const $ = id => document.getElementById(id);
        const input = $('link-input'), iframe = $('main-iframe'), urlBar = $('url-bar'), backdrop = $('backdrop');

        function stripProtocol(url) {
            return url.replace(/^https?:\/\//i, '');
        }

        function getCustomHome() {
            return localStorage.getItem('custom_main_link') || HARDCODED_LINK;
        }

        function closeUrlBar() {
            urlBar.classList.remove('active-mode');
            backdrop.classList.remove('active');
            input.blur();
        }

        function openUrlBar(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            urlBar.classList.add('active-mode');
            backdrop.classList.add('active');
            requestAnimationFrame(() => {
                setTimeout(() => input.focus(), 50);
            });
        }

        function setIframeSrc(url) {
            closeUrlBar();
            requestAnimationFrame(() => {
                if (iframe.src !== url) {
                    iframe.src = url;
                }
            });
        }

        function loadHome() {
            const homeUrl = getCustomHome();
            input.value = stripProtocol(homeUrl);
            setIframeSrc(homeUrl);
        }

        document.addEventListener('DOMContentLoaded', loadHome);

        function navigate() {
            let val = input.value.trim();
            if (!val) {
                loadHome();
                return;
            }
            
            let targetUrl = val;
            if (/^https?:\/\//i.test(val) || (val.includes('.') && !val.includes(' '))) {
                if (!/^https?:\/\//i.test(val)) targetUrl = 'https://' + val;
                input.value = stripProtocol(targetUrl);
                setIframeSrc(targetUrl);
            } else {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
                input.value = val;
                setIframeSrc(targetUrl);
            }
        }

        let touchStarted = false;
        urlBar.addEventListener('touchstart', function(e) {
            touchStarted = true;
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        }, {passive: false});

        urlBar.addEventListener('click', function(e) {
            if (touchStarted) {
                touchStarted = false;
                return;
            }
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        });

        backdrop.addEventListener('touchstart', closeUrlBar, {passive: true});
        backdrop.addEventListener('click', closeUrlBar);

        // Sự kiện nút Tải lại (Reload) iframe thủ công khi người dùng mở thanh công cụ
        $('reload-btn').onclick = (e) => {
            e.stopPropagation();
            iframe.src = iframe.src; // Tải lại trang hiện tại trong iframe
            closeUrlBar();
        };

        $('set-btn').onclick = (e) => {
            e.stopPropagation();
            let val = input.value.trim();
            let fullUrl = val || stripProtocol(getCustomHome());

            if (val && !/^https?:\/\//i.test(val) && val.includes('.')) {
                fullUrl = 'https://' + val;
            } else if (!/^https?:\/\//i.test(fullUrl)) {
                fullUrl = 'https://' + fullUrl;
            }

            localStorage.setItem('custom_main_link', fullUrl);
            loadHome();
        };

        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                navigate();
            }
        };

        const handleFullscreenOrientation = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
            if (isFullscreen && screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            } else if (!isFullscreen && screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenOrientation);
        document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);

        let wakeLock = null;
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch (err) {
                    console.log('Wake Lock error:', err);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', requestWakeLock);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
        
        ['click', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                if (!wakeLock) requestWakeLock();
            }, {passive: true});
        });
    </script>
</body>
</html>
