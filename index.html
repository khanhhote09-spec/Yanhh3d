<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YanHH3D</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body, .iframe-container, iframe {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        
        html::-webkit-scrollbar, 
        body::-webkit-scrollbar, 
        .iframe-container::-webkit-scrollbar, 
        iframe::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        :fullscreen .url-bar, :-webkit-full-screen .url-bar {
            display: none !important;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999998;
            display: none;
            background: transparent;
        }

        .backdrop.active {
            display: block;
        }

        .url-bar {
            width: 60px;
            height: 60px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            gap: 6px;
            z-index: 999999;
            position: absolute;
            top: 0;
            right: 0;
            cursor: pointer;
            pointer-events: auto;
            transition: width 0.15s cubic-bezier(0, 0, 0.2, 1), height 0.15s cubic-bezier(0, 0, 0.2, 1);
            will-change: width, height;
        }

        .url-bar.active-mode {
            width: 100%;
            height: auto;
            min-height: 48px;
            background: #121212;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px;
            cursor: default;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .url-bar-top {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .url-bar input {
            width: 0;
            opacity: 0;
            pointer-events: none;
            height: 34px;
            padding: 0;
            border-radius: 17px;
            border: none;
            background: #1e1e1e;
            color: #fff !important;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: opacity 0.15s ease;
        }

        .url-bar.active-mode input {
            flex: 1;
            width: auto;
            opacity: 1;
            pointer-events: auto;
            padding: 0 12px;
            border: 1px solid #2a2a2a;
        }

        .url-bar input:focus {
            border-color: #007aff;
            background: #181818;
        }

        .btn-icon {
            height: 34px;
            width: 34px;
            border-radius: 17px;
            border: none;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .btn-icon.set-btn {
            background: #34c759;
        }

        .btn-icon.sub-btn {
            background: #007aff;
        }

        .url-bar.active-mode .btn-icon {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        /* Danh sách Link phụ */
        .sub-links-container {
            display: none;
            flex-direction: column;
            gap: 4px;
            max-height: 150px;
            overflow-y: auto;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .url-bar.active-mode .sub-links-container {
            display: flex;
        }

        .sub-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #fff;
            gap: 8px;
        }

        .sub-link-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .sub-link-text:hover {
            color: #007aff;
        }

        .sub-link-delete {
            background: transparent;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
        }

        iframe {
            width: calc(100% + 20px) !important;
            height: 100% !important;
            border: none;
            display: block;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>

    <div class="iframe-container" id="iframe-container">
        <iframe id="main-iframe" src="https://yanhh3d.plus" title="Website" loading="eager" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen 
            webkitallowfullscreen 
            mozallowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms">
        </iframe>
    </div>

    <div class="url-bar" id="url-bar" title="Bấm góc trên bên phải để nhập link">
        <div class="url-bar-top">
            <input type="text" id="link-input" value="" placeholder="Nhập link hoặc từ khóa..." autocomplete="off" spellcheck="false">
            <button class="btn-icon sub-btn" id="add-sub-btn" title="Thêm vào danh sách Link phụ">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <button class="btn-icon set-btn" id="set-btn" title="Lưu làm link mặc định (Set Web)">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l2 2h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm-6-11h-2v3H8l4 4 4-4h-3v-3z"/></svg>
            </button>
        </div>
        <div class="sub-links-container" id="sub-links-container">
            <!-- Danh sách link phụ sẽ được render tự động ở đây -->
        </div>
    </div>

    <script>
        window.open = function() { return null; };
        
        document.addEventListener('click', function(e) {
            let target = e.target.closest('a');
            if (target && (target.target === '_blank' || target.target === '_top' || target.target === '_parent')) {
                target.target = '_self';
            }
        }, true);

        const HARDCODED_LINK = 'https://yanhh3d.plus';
        const $ = id => document.getElementById(id);
        const input = $('link-input'), iframe = $('main-iframe'), urlBar = $('url-bar'), backdrop = $('backdrop'), subLinksContainer = $('sub-links-container');

        function stripProtocol(url) {
            return url.replace(/^https?:\/\//i, '');
        }

        function getCustomHome() {
            return localStorage.getItem('custom_main_link') || HARDCODED_LINK;
        }

        function getSubLinks() {
            try {
                return JSON.parse(localStorage.getItem('custom_sub_links')) || [];
            } catch(e) {
                return [];
            }
        }

        function saveSubLinks(links) {
            localStorage.setItem('custom_sub_links', JSON.stringify(links));
            renderSubLinks();
        }

        function renderSubLinks() {
            const links = getSubLinks();
            subLinksContainer.innerHTML = '';
            if (links.length === 0) {
                subLinksContainer.innerHTML = '<div style="font-size:11px; color:#888; text-align:center; padding: 4px;">Chưa có link phụ nào</div>';
                return;
            }
            links.forEach((link, index) => {
                const item = document.createElement('div');
                item.className = 'sub-link-item';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'sub-link-text';
                textSpan.textContent = link;
                textSpan.title = "Bấm để mở link này";
                textSpan.onclick = () => {
                    input.value = stripProtocol(link);
                    setIframeSrc(link);
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'sub-link-delete';
                delBtn.innerHTML = '&times;';
                delBtn.title = "Xóa link này";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    let currentLinks = getSubLinks();
                    currentLinks.splice(index, 1);
                    saveSubLinks(currentLinks);
                };

                item.appendChild(textSpan);
                item.appendChild(delBtn);
                subLinksContainer.appendChild(item);
            });
        }

        function closeUrlBar() {
            urlBar.classList.remove('active-mode');
            backdrop.classList.remove('active');
            input.blur();
        }

        function openUrlBar(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            renderSubLinks();
            urlBar.classList.add('active-mode');
            backdrop.classList.add('active');
            requestAnimationFrame(() => {
                setTimeout(() => input.focus(), 50);
            });
        }

        function setIframeSrc(url) {
            closeUrlBar();
            requestAnimationFrame(() => {
                if (iframe.src !== url) {
                    iframe.src = url;
                }
            });
        }

        function loadHome() {
            const homeUrl = getCustomHome();
            input.value = stripProtocol(homeUrl);
            setIframeSrc(homeUrl);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadHome();
            renderSubLinks();
        });

        function formatUrl(val) {
            if (!val) return '';
            let targetUrl = val;
            if (/^https?:\/\//i.test(val) || (val.includes('.') && !val.includes(' '))) {
                if (!/^https?:\/\//i.test(val)) targetUrl = 'https://' + val;
            } else {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
            }
            return targetUrl;
        }

        function navigate() {
            let val = input.value.trim();
            if (!val) {
                loadHome();
                return;
            }
            let targetUrl = formatUrl(val);
            input.value = stripProtocol(targetUrl);
            setIframeSrc(targetUrl);
        }

        let touchStarted = false;
        urlBar.addEventListener('touchstart', function(e) {
            touchStarted = true;
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        }, {passive: false});

        urlBar.addEventListener('click', function(e) {
            if (touchStarted) {
                touchStarted = false;
                return;
            }
            if (!urlBar.classList.contains('active-mode')) {
                openUrlBar(e);
            }
        });

        backdrop.addEventListener('touchstart', closeUrlBar, {passive: true});
        backdrop.addEventListener('click', closeUrlBar);

        // Nút lưu Link mặc định (Set Web)
        $('set-btn').onclick = (e) => {
            e.stopPropagation();
            let val = input.value.trim();
            let fullUrl = val ? formatUrl(val) : getCustomHome();
            localStorage.setItem('custom_main_link', fullUrl);
            loadHome();
        };

        // Nút thêm Link phụ (+)
        $('add-sub-btn').onclick = (e) => {
            e.stopPropagation();
            let val = input.value.trim();
            if (!val) return;
            let fullUrl = formatUrl(val);
            let links = getSubLinks();
            if (!links.includes(fullUrl)) {
                links.push(fullUrl);
                saveSubLinks(links);
            }
            input.value = '';
        };

        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                navigate();
            }
        };

        const handleFullscreenOrientation = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
            if (isFullscreen && screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            } else if (!isFullscreen && screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenOrientation);
        document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);

        let wakeLock = null;
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch (err) {
                    console.log('Wake Lock error:', err);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', requestWakeLock);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
        
        ['click', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                if (!wakeLock) requestWakeLock();
            }, {passive: true});
        });
    </script>
</body>
</html>
