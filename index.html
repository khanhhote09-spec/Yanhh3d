<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bom.so/yanhh3d</title>
    <link rel="preconnect" href="https://yanhh3d.kim" crossorigin>
    <link rel="dns-prefetch" href="https://yanhh3d.kim">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 1. ẨN THANH CUỘN */
        html, body, .iframe-container, iframe {
            -ms-overflow-style: none; /* IE, Edge */
            scrollbar-width: none;    /* Firefox */
        }
        
        html::-webkit-scrollbar, 
        body::-webkit-scrollbar, 
        .iframe-container::-webkit-scrollbar, 
        iframe::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* 2. TỐI ƯU HIỆU NĂNG & GPU (FIX LAG) */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Khóa khung ngoài để chống giật tràn lề */
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
            scroll-behavior: smooth;
        }

        .url-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: #121212;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 6px;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            will-change: transform;
            transform: translateZ(0);
        }

        .url-bar img {
            height: 28px;
            width: 28px;
            border-radius: 8px;
            object-fit: contain;
            flex-shrink: 0;
            cursor: pointer;
        }

        .url-bar input {
            flex: 1;
            height: 34px;
            padding: 0 12px;
            border-radius: 17px;
            border: 1px solid #2a2a2a;
            background: #1e1e1e;
            color: #fff;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            min-width: 0;
            transition: border-color .2s, background .2s;
        }

        .url-bar input:focus {
            border-color: #007aff;
            background: #181818;
        }

        .btn-icon {
            height: 34px;
            width: 34px;
            border-radius: 17px;
            border: none;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .1s, opacity .1s, background .2s;
        }

        .btn-icon:active {
            transform: scale(.92);
            opacity: .8;
        }

        /* Nút chữ Set Web */
        .btn-text.set-btn {
            height: 34px;
            padding: 0 10px;
            border-radius: 17px;
            border: none;
            background: #34c759; /* Màu xanh lá cây nổi bật */
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            white-space: nowrap;
            transition: transform .1s, opacity .1s, background .2s;
        }

        .btn-text.set-btn:active {
            transform: scale(.92);
            opacity: .8;
        }

        .btn-icon.go-btn {
            background: #007aff;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        /* Tối ưu hóa khung chứa iframe */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding-top: 48px;
            background: #000;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            will-change: scroll-position;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            will-change: transform;
            transform: translateZ(0);
        }
    </style>
</head>
<body>
    <div class="url-bar" id="url-bar">
        <!-- Bấm vào Logo để về trang gốc -->
        <img src="https://www.google.com/s2/favicons?domain=yanhh3d.kim&sz=64" alt="Logo" id="logo-btn" title="Chạm để về trang gốc" loading="lazy">
        <input type="text" id="link-input" value="https://yanhh3d.kim/" placeholder="Nhập link hoặc từ khóa..." autocomplete="off" spellcheck="false">
        
        <!-- Nút dạng Chữ Set Web -->
        <button class="btn-text set-btn" id="set-btn" title="Lưu làm link mặc định (Set Web)">Set Web</button>

        <!-- Nút Đi / Tìm kiếm -->
        <button class="btn-icon go-btn" id="go-btn" title="Đi tới / Tìm kiếm">
            <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.98L17 12 2.87 13.9c-.5.05-.87.48-.87.98l.01 4.61c0 .73.73 1.25 1.39.91z"/></svg>
        </button>
    </div>

    <div class="iframe-container" id="iframe-container">
        <iframe id="main-iframe" src="https://yanhh3d.kim/" title="Website" loading="eager" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; web-share; screen-wake-lock; camera; microphone; geolocation" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-orientation-lock allow-downloads"></iframe>
    </div>

    <script>
        // CHẶN QUẢNG CÁO & BẬT TAB Ở TRANG MẸ
        window.open = function() {
            console.warn('Đã ngăn chặn mở tab / quảng cáo mới.');
            return null;
        };

        // Passive Event Listener giúp tối ưu hiệu năng cuộn
        document.addEventListener('touchstart', function() {}, {passive: true});
        document.addEventListener('touchmove', function() {}, {passive: true});

        document.addEventListener('click', function(e) {
            let target = e.target.closest('a');
            if (target && target.target === '_blank') {
                e.preventDefault();
            }
        }, true);

        // LINK GỐC MẶC ĐỊNH LẦN ĐẦU TẢI TRANG
        const HARDCODED_LINK = 'https://yanhh3d.kim/';
        const $ = id => document.getElementById(id);
        const input = $('link-input'), iframe =$('main-iframe');

        // Lấy link gốc đã được SET hoặc lấy link mặc định
        function getCustomHome() {
            return localStorage.getItem('custom_main_link') || HARDCODED_LINK;
        }

        // Tải trang gốc
        function loadHome() {
            const homeUrl = getCustomHome();
            input.value = homeUrl;
            iframe.src = homeUrl;
            updateLogo(homeUrl);
        }

        document.addEventListener('DOMContentLoaded', loadHome);

        function updateLogo(url) {
            try {
                const domain = new URL(url).hostname;
                $('logo-btn').src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                $('logo-btn').src = `https://www.google.com/s2/favicons?domain=yanhh3d.kim&sz=64`;
            }
        }

        function navigate() {
            let val = input.value.trim();
            if (!val) return;
            
            if (/^https?:\/\//i.test(val) || (val.includes('.') && !val.includes(' '))) {
                if (!/^https?:\/\//i.test(val)) val = 'https://' + val;
                iframe.src = val;
            } else {
                iframe.src = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
            }
            
            updateLogo(iframe.src);
        }

        // Đặt link hiện tại trong ô làm link gốc mặc định mới
        $('set-btn').onclick = () => {
            let val = input.value.trim();
            if (!val) return;
            
            if (!/^https?:\/\//i.test(val) && val.includes('.')) {
                val = 'https://' + val;
            }

            localStorage.setItem('custom_main_link', val);
            alert('Đã thiết lập link mặc định mới:\n' + val);
            loadHome();
        };

        $('go-btn').onclick = navigate;
        $('logo-btn').onclick = loadHome; // Nhấn logo để về link gốc

        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                navigate();
                this.blur();
            }
        };

        // Giữ màn hình luôn sáng
        let wakeLock = null;
        const reqWake = async () => { if ('wakeLock' in navigator) try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} };
        document.addEventListener('DOMContentLoaded', reqWake);
        document.onclick = () => { if (!wakeLock) reqWake(); };
        document.onvisibilitychange = () => { if (document.visibilityState === 'visible') reqWake(); };
    </script>
</body>
</html>
